[tool.poetry]
name = "datamind-ai"
version = "0.1.0"
description = "Reproducible data science and machine learning research toolkit."
authors = ["hishmat-dev <developerhishmat1@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "datamind", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "1.26.4"
pandas = "2.2.3"
pydantic = "2.10.3"
pydantic-settings = "2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-cov = "6.0.0"
ruff = "0.8.2"
mypy = "1.13.0"

[tool.poetry.group.ui.dependencies]
streamlit = "1.40.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --cov=datamind --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["datamind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["datamind"]
mypy_path = "src"
ignore_missing_imports = true
